      controls.autoRotateSpeed = parseFloat(rngRotSpeed.value);

      chkAutoRotate.addEventListener("change", () => {
        controls.autoRotate = chkAutoRotate.checked;
      });
      rngRotSpeed.addEventListener("input", () => {
        const v = parseFloat(rngRotSpeed.value);
        controls.autoRotateSpeed = v;
        lblRotSpeed.textContent = v.toFixed(1);
      });

      // Graph edges toggle — controls main (regular) edge mesh only.
      // Bridges are a separate overlay under the false-bridges checkbox.
      chkGraph.addEventListener("change", () => {
        pushDebugLine(`toggle graph -> ${chkGraph.checked ? "on" : "off"}`);
        applyGraphVisibility();
        buildLegend();
      });

      // False-bridge toggle — Tier 1 .visible flip on the bridge overlay meshes.
      const chkFalseBridges = document.getElementById("chk-falsebridges");
      chkFalseBridges.checked = falseBridgeOn;
      chkFalseBridges.addEventListener("change", () => {
        falseBridgeOn = chkFalseBridges.checked;
        pushDebugLine(
          `toggle bridges -> ${chkFalseBridges.checked ? "on" : "off"}`,
        );
        applyGraphVisibility();
        buildLegend();
      });

      selScalar.addEventListener("change", () => {
        const layer =
          sceneNodeSignalLayers.find((l) => l.name === selScalar.value) ?? null;
        applyNodeSignalLayer(layer);
        buildLegend();
      });

      selLineField.addEventListener("change", () => {
        pushDebugLine(`linefield -> ${selLineField.value || "off"}`);
        applyLineFieldLayer(selLineField.value);
      });

      selTriangles.addEventListener("change", () => {
        pushDebugLine(`triangles -> ${selTriangles.value || "off"}`);
        applyTriangleLayer(selTriangles.value);
        buildLegend();
        refreshDebugConsole("applyTriangleLayer");
      });

      // Spine curves + frame arrows (Tier 1: .visible flip only)
      const chkGaussians = document.getElementById("chk-gaussians");
      const chkWireframe = document.getElementById("chk-wireframe");
      const chkSpineCurves = document.getElementById("chk-spinecurves");
      const chkFrameArrows = document.getElementById("chk-framearrows");
      // Surface and wireframe default off — user opts in via the right panel.
      // The render hints are still honoured if explicitly set in the scene JSON.
      chkGaussians.checked = SCENE.hints?.show_gaussian_ellipsoids ?? false;
      chkWireframe.checked = SCENE.hints?.show_gaussian_wireframe ?? false;
      chkSpineCurves.checked = SCENE.hints?.show_spine_overlays ?? true;
      chkFrameArrows.checked = SCENE.hints?.show_tangent_bases ?? true;

      // Apply initial visibility derived from checkbox state.
      function applyGaussianVisibility() {
        const showSurface = chkGaussians.checked;
        const showWire = chkWireframe.checked;
        for (const grp of gaussianMeshGroups) {
          grp.traverse((obj) => {
            if (obj.userData.isSurface) obj.visible = showSurface;
            if (obj.userData.isWireframe) obj.visible = showWire;
          });
        }
      }
      applyGaussianVisibility();

      chkGaussians.addEventListener("change", applyGaussianVisibility);
      chkWireframe.addEventListener("change", applyGaussianVisibility);

      // Mode dropdown — Oracle vs EM is a backend choice, so it triggers regen.
      const rpGmmMode = document.getElementById("rp-gmmMode");
      rpGmmMode.addEventListener("change", doRegen);
      chkSpineCurves.addEventListener("change", () => {
        const on = chkSpineCurves.checked;
        const fa = chkFrameArrows.checked;
        for (const obj of spineLayerObjects) {
          obj.curve.visible = on;
          obj.arrowGroup.visible = on && fa;
        }
      });
      chkFrameArrows.addEventListener("change", () => {
        const on = chkSpineCurves.checked;
        const fa = chkFrameArrows.checked;
        for (const obj of spineLayerObjects) {
          obj.arrowGroup.visible = on && fa;
        }
      });

      // Flow field toggle (Tier 1: .visible flip only)
      const chkFlow = document.getElementById("chk-flow");
      chkFlow.checked = SCENE.hints?.show_vector_field ?? false;
      chkFlow.addEventListener("change", () => {
        pushDebugLine(`toggle flow -> ${chkFlow.checked ? "on" : "off"}`);
        applyFlowVisibility();
        buildLegend();
      });
      // ── Generator panel (schema-driven) ──────────────────────────────────────────────
      // Reads SCENE.generator_param_schema and SCENE.generator_params to build
      // interactive controls for any generator without hardcoded HTML.
      // To add a new generator: register its schema in SchemaCatalog.cs (C# side only).
      let currentGenSchema = SCENE.generator_param_schema ?? null;

      // Clears and rebuilds gen-body controls from schema + current param values.
      // Called at load and after every rehydrate that changes the generator/schema.
      function rebuildGenPanel(gp, schema) {
        if (!gp || !schema) return;
        currentGenSchema = schema;
        const body = document.getElementById("gen-body");
        while (body.firstChild) body.removeChild(body.firstChild);
        let epsilonRow = null;
        let ruleSelect = null;
        for (const section of schema.sections) {
          const hdr = document.createElement("div");
          hdr.className = "gp-sec";
          hdr.textContent = section.label;
          body.appendChild(hdr);
          for (const param of section.params) {
            const el = buildParamControl(param, gp);
            body.appendChild(el);
            if (param.key === "epsilonBallEpsilon") epsilonRow = el;
            if (param.key === "neighborRule")
              ruleSelect = el.querySelector("select");
          }
        }
        if (ruleSelect && epsilonRow) {
          const syncEps = () => {
            epsilonRow.style.display =
              ruleSelect.value === "EpsilonBall" ? "" : "none";
          };
          ruleSelect.addEventListener("change", syncEps);
          syncEps();
        }
        const btn = document.createElement("button");
        btn.id = "btn-regen";
        btn.textContent = "Regenerate";
        body.appendChild(btn);
        btn.addEventListener("click", doRegen);
      }

      // Shared regen action — called by button click and Enter keydown on int fields.
      let _activeRegenController = null;
      let _latestRegenRequestId = 0;

      function issueRegenRequest(payload, sentParams = payload) {
        const requestId = ++_latestRegenRequestId;
        const btn = document.getElementById("btn-regen");

        if (_activeRegenController) {
          pushDebugLine(`abort regen #${requestId - 1}`);
          _activeRegenController.abort();
        }
        const controller = new AbortController();
        _activeRegenController = controller;
        pushDebugLine(
          `start regen #${requestId} metric=${payload.metric ?? "-"} graph=${payload.neighborRule ?? "-"} flow=${payload.showFlow ?? "-"}`,
        );
        refreshDebugConsole(`start regen #${requestId}`);

        if (btn) btn.disabled = true;
        fetch("/api/regen", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        })
          .then((r) => {
            if (!r.ok) throw new Error(`/api/regen ${r.status}`);
            return r.json();
          })
          .then((json) => {
            if (requestId !== _latestRegenRequestId) {
              pushDebugLine(`drop stale regen #${requestId}`);
              return;
            }
            pushDebugLine(
              `finish regen #${requestId} edges=${json.edge_layers?.length ?? 0} flow=${json.vector_field_layers?.length ?? 0}`,
            );
            rehydrateFromJson(json, sentParams);
          })
          .catch((err) => {
            if (err?.name === "AbortError") {
              pushDebugLine(`abort handled regen #${requestId}`);
              refreshDebugConsole(`abort regen #${requestId}`);
              return;
            }
            pushDebugLine(`regen #${requestId} failed: ${err?.message ?? err}`);
            console.error("Regen failed:", err);
          })
          .finally(() => {
            if (_activeRegenController !== controller) return;
            _activeRegenController = null;
            if (btn) btn.disabled = false;
            refreshDebugConsole(`settled regen #${requestId}`);
          });
      }

      function doRegen() {
        if (!currentGenSchema) return;
        const p = harvestParams(currentGenSchema);
        issueRegenRequest(p, p);
      }

      // Debounce wrapper for continuous inputs (range sliders).
      // Waits 380 ms of inactivity before firing doRegen.
      let _regenTimer = null;
      function doRegenDebounced() {
        clearTimeout(_regenTimer);
        _regenTimer = setTimeout(doRegen, 380);
      }

      (function initGenPanel() {
        const gp = SCENE.generator_params;
        const sch = SCENE.generator_param_schema;
        if (!gp || !sch) return;

        document.getElementById("gen-panel").style.display = "flex";
        document
          .getElementById("gen-toggle")
          .addEventListener("click", function () {
            const body = document.getElementById("gen-body");
            const show = body.style.display === "none";
            body.style.display = show ? "" : "none";
            this.textContent = show ? "hide" : "show";
          });

        // Populate generator picker from catalog baked into the scene JSON
        const selGen = document.getElementById("sel-generator");
        for (const name of SCENE.generator_catalog ?? []) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          selGen.appendChild(opt);
        }
        selGen.value = gp.generator ?? "";

        // Generator-switch handler: sends only { generator } so C# defaults fill the rest
        selGen.addEventListener("change", () => {
          const gen = selGen.value;
          if (!gen) return;
          issueRegenRequest({ generator: gen }, null);
        });

        rebuildGenPanel(gp, sch);
      })();

      // Build one DOM element (label or div) for a param spec.
      // Current value seeded from currentValues[param.key] if present.
      function buildParamControl(param, currentValues) {
        const key = param.key;
        const curVal = currentValues?.[key];

        if (param.type === "int") {
          const lbl = document.createElement("label");
          const inp = document.createElement("input");
          inp.type = "number";
          inp.id = `gp-${key}`;
          if (param.min != null) inp.min = param.min;
          if (param.max != null) inp.max = param.max;
          inp.value = curVal ?? 0;
          inp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") doRegen();
          });
          lbl.appendChild(document.createTextNode(param.label + " "));
          lbl.appendChild(inp);
          return lbl;
        }

        if (param.type === "float") {
          const lbl = document.createElement("label");
          const inp = document.createElement("input");
          const span = document.createElement("span");
          inp.type = "range";
          inp.id = `gp-${key}`;
          inp.min = param.min ?? 0;
          inp.max = param.max ?? 1;
          inp.step = param.step ?? 0.01;
          inp.value = curVal ?? 0;
          const dvs = param.display_values;
          const fmtVal = (v) =>
            dvs
              ? (dvs[Math.round(parseFloat(v))] ?? v)
              : param.step != null && param.step >= 1
                ? String(Math.round(parseFloat(v)))
                : parseFloat(v).toFixed(2);
          span.textContent = fmtVal(inp.value);
          inp.addEventListener("input", () => {
            span.textContent = fmtVal(inp.value);
            doRegenDebounced();
          });
          lbl.appendChild(document.createTextNode(param.label + " "));
          lbl.appendChild(inp);
          lbl.appendChild(span);
          return lbl;
        }

        if (param.type === "bool") {
          const lbl = document.createElement("label");
          const inp = document.createElement("input");
          inp.type = "checkbox";
          inp.id = `gp-${key}`;
          inp.checked = !!curVal;
          inp.addEventListener("change", doRegen);
          lbl.appendChild(inp);
          lbl.appendChild(document.createTextNode(" " + param.label));
          return lbl;
        }

        if (param.type === "enum") {
          const lbl = document.createElement("label");
          const sel = document.createElement("select");
          sel.id = `gp-${key}`;
          for (const v of param.enum_values ?? []) {
            const opt = document.createElement("option");
            opt.value = v;
            opt.textContent = v;
            sel.appendChild(opt);
          }
          if (curVal != null) sel.value = String(curVal); // coerce int echoes (e.g. 3→"3") to match option values
          sel.addEventListener("change", doRegen);
          lbl.appendChild(document.createTextNode(param.label + " "));
          lbl.appendChild(sel);
          return lbl;
        }

        if (param.type === "vec3") {
          // Returns a <div> containing 3 labeled range sliders.
          const wrap = document.createElement("div");
          const vals = Array.isArray(curVal) ? curVal : [0, 0, 0];
          const labels = param.vec_labels ?? ["a", "b", "c"];
          for (let i = 0; i < 3; i++) {
            const row = document.createElement("label");
            const inp = document.createElement("input");
            const span = document.createElement("span");
            inp.type = "range";
            inp.id = `gp-${key}-${i}`;
            inp.min = param.min ?? 0;
            inp.max = param.max ?? 3;
            inp.step = param.step ?? 0.05;
            inp.value = vals[i] ?? 0;
            span.textContent = parseFloat(inp.value).toFixed(2);
            inp.addEventListener("input", () => {
              span.textContent = parseFloat(inp.value).toFixed(2);
              doRegenDebounced();
            });
            row.appendChild(document.createTextNode(labels[i] + " "));
            row.appendChild(inp);
            row.appendChild(span);
            wrap.appendChild(row);
          }
          return wrap;
        }

        // Fallback: plain text input
        const lbl = document.createElement("label");
        const inp = document.createElement("input");
        inp.type = "text";
        inp.id = `gp-${key}`;
        inp.value = curVal ?? "";
        lbl.appendChild(document.createTextNode(param.label + " "));
        lbl.appendChild(inp);
        return lbl;
      }

      // Walk the schema and collect current control values into a plain object.
      function harvestParams(schema) {
        const p = {
          generator: document.getElementById("sel-generator")?.value ?? "",
        };
        // Graph/shared params live in the right panel, not the gen panel schema.
        p.neighborRule = rpRule.value;
        p.epsilonBallEpsilon = parseFloat(rpEps.value);
        p.knnK = parseInt(rpKnnK.value, 10);
        p.metric = buildMetricSpec();
        p.kernel = rpKernel.value;
        p.bandwidth = parseFloat(rpBandwidth.value);
        p.ensureConnected = rpEnsureConnected.checked;
        p.seed = parseInt(rpSeed.value, 10);
        // GMM params — static right-panel controls (removed from OverlaySection schema).
        p.gmmComponents = parseFloat(rpGmmComponents.value);
        p.gmmMode = document.getElementById("rp-gmmMode")?.value ?? "Oracle";
        p.showFlow = chkFlow.checked;
        p.flowMode = rpFlowMode.value;
        for (const section of schema.sections) {
          for (const param of section.params) {
            const key = param.key;
            if (param.type === "int") {
              p[key] = parseInt(
                document.getElementById(`gp-${key}`)?.value ?? "0",
                10,
              );
            } else if (param.type === "float") {
              p[key] = parseFloat(
                document.getElementById(`gp-${key}`)?.value ?? "0",
              );
            } else if (param.type === "bool") {
              p[key] = document.getElementById(`gp-${key}`)?.checked ?? false;
            } else if (param.type === "enum") {
              const raw = document.getElementById(`gp-${key}`)?.value ?? "";
              // Send numeric-looking enum values as numbers so C# int properties deserialize correctly.
              const asNum = Number(raw);
              p[key] = raw !== "" && !isNaN(asNum) ? asNum : raw;
            } else if (param.type === "vec3") {
              p[key] = [0, 1, 2].map((i) =>
                parseFloat(
                  document.getElementById(`gp-${key}-${i}`)?.value ?? "0",
                ),
              );
            }
          }
        }
        return p;
      }

      // ── Scene rehydration (from /api/regen response) ─────────────────────────────────
      // Accepts a ScenePackageJson object (same schema as SCENE).
      // Performs Tier 3 geometry dispose + rebuild — acceptable on user button click only.
      function rehydrateFromJson(newScene, sentParams = null) {
        pushDebugLine(
          `rehydrate edges=${newScene.edge_layers?.length ?? 0} triangles=${newScene.triangle_layers?.length ?? 0} flow=${newScene.vector_field_layers?.length ?? 0}`,
        );
        // Tier 3 cleanup
        if (pointsMeshRef) {
          scene.remove(pointsMeshRef);
          pointsMeshRef.geometry.dispose();
        }
        for (const pair of Object.values(edgeMeshes)) {
          scene.remove(pair.main, pair.bridges);
          pair.main.geometry.dispose();
          pair.bridges.geometry.dispose();
        }
        for (const key of Object.keys(edgeMeshes)) delete edgeMeshes[key];
        for (const obj of spineLayerObjects) {
          scene.remove(obj.curve, obj.arrowGroup);
          obj.curve.geometry.dispose();
          obj.arrowGroup.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }
        spineLayerObjects.length = 0;
        for (const grp of gaussianMeshGroups) {
          scene.remove(grp);
          grp.traverse((child) => {
            if (child.material) child.material.dispose();
            // geometry is shared UNIT_SPHERE_GEO — do not dispose
          });
        }
        gaussianMeshGroups.length = 0;
        for (const m of _flowMeshes) {
          scene.remove(m);
          m.geometry.dispose();
          m.material.dispose();
        }
        _flowMeshes.length = 0;
        for (const m of _lineFieldMeshes) {
          scene.remove(m);
          m.geometry.dispose();
          m.material.dispose();
        }
        _lineFieldMeshes.length = 0;
        for (const m of _triangleMeshes) {
          scene.remove(m);
          m.geometry.dispose();
          m.material.dispose();
        }
        _triangleMeshes.length = 0;

        // Update label array (used by buildEdgeMesh for false-bridge coloring)
        const newLabelLayers = newScene.label_layers ?? [];
        const newActiveLayer =
          newLabelLayers.find((l) => l.kind === "GroundTruth") ??
          newLabelLayers[0] ??
          null;
        labels = newActiveLayer?.labels ?? null;

        const pc = newScene.points;
        const newN = pc.n;
        const newD = pc.d;
        const raw = pc.features;
        positions = new Float32Array(newN * 3);
        const newColors = new Float32Array(newN * 3);
        for (let i = 0; i < newN; i++) {
          positions[i * 3] = raw[i * newD];
          positions[i * 3 + 1] = newD >= 2 ? raw[i * newD + 1] : 0;
          positions[i * 3 + 2] = newD >= 3 ? raw[i * newD + 2] : 0;
          const k = labels ? labels[i] : -999;
          tmpColor.setHex(k === -999 ? UNSET_COLOR : clusterColor(k));
          newColors[i * 3] = tmpColor.r;
          newColors[i * 3 + 1] = tmpColor.g;
          newColors[i * 3 + 2] = tmpColor.b;
        }

        const newGeo = new THREE.BufferGeometry();
        newGeo.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        newGeo.setAttribute("color", new THREE.BufferAttribute(newColors, 3));
        newGeo.computeBoundingSphere();
        pointsMeshRef = new THREE.Points(newGeo, pointsMat);
        scene.add(pointsMeshRef);

        const newEdgeLayers = newScene.edge_layers ?? [];
        for (const layer of newEdgeLayers) {
          const pair = buildEdgeMesh(layer);
          edgeMeshes[layer.name] = pair;
          scene.add(pair.main, pair.bridges);
        }
        // Recompute the stats line from the new edge layer so the legend reads
        // diagnostics for the graph that was actually built, not the previous one.
        _activeDiagnostics =
          newEdgeLayers.length > 0
            ? computeEdgeDiagnostics(newEdgeLayers[0], newN)
            : null;
        syncRightPanelFromParams(sentParams ?? newScene.generator_params);
        updateGraphSpec();

        const newBs = newGeo.boundingSphere;
        if (newBs) {
          const r = newBs.radius || 1;
          camera.position.set(
            newBs.center.x,
            newBs.center.y,
            newBs.center.z + r * 2.4,
          );
          controls.target.copy(newBs.center);
          camera.near = r * 0.001;
          camera.far = r * 100;
          camera.updateProjectionMatrix();
          controls.update();
        }

        const newCloudR = newBs?.radius || 1;
        for (const layer of newScene.gaussian_layers ?? []) {
          const grp = buildGaussianGroup(layer);
          grp.visible = true;
          scene.add(grp);
          gaussianMeshGroups.push(grp);
        }
        applyGaussianVisibility();
        for (const layer of newScene.spine_layers ?? []) {
          const obj = buildSpineObjects(layer, newCloudR);
          obj.curve.visible = chkSpineCurves.checked;
          obj.arrowGroup.visible =
            chkSpineCurves.checked && chkFrameArrows.checked;
          scene.add(obj.curve, obj.arrowGroup);
          spineLayerObjects.push(obj);
        }
        for (const layer of newScene.vector_field_layers ?? []) {
          const mesh = buildFlowField(layer, newCloudR, newScene.points);
          scene.add(mesh);
          _flowMeshes.push(mesh);
        }
        for (const layer of newScene.line_field_layers ?? []) {
          const mesh = buildLineField(layer, newCloudR, newScene.points);
          mesh.visible = false;
          scene.add(mesh);
          _lineFieldMeshes.push(mesh);
        }
        for (const layer of newScene.triangle_layers ?? []) {
          const mesh = buildTriangleMesh(layer);
          mesh.visible = false;
          scene.add(mesh);
          _triangleMeshes.push(mesh);
        }
        applyGraphVisibility();
        applyFlowVisibility();
        refreshDebugConsole("rehydrate");

        // Reset node-signal selector; populate from new scene
        const prevScalar = selScalar.value;
        while (selScalar.options.length > 1) selScalar.remove(1);
        for (const layer of newScene.node_signal_layers ?? []) {
          const opt = document.createElement("option");
          opt.value = layer.name;
          opt.textContent = layer.name;
          selScalar.appendChild(opt);
        }
        sceneNodeSignalLayers.length = 0;
        sceneNodeSignalLayers.push(...(newScene.node_signal_layers ?? []));
        const restoredLayer =
          sceneNodeSignalLayers.find((l) => l.name === prevScalar) ?? null;
        if (prevScalar && restoredLayer) {
          selScalar.value = prevScalar;
          applyNodeSignalLayer(restoredLayer);
        } else {
          selScalar.value = "";
          applyNodeSignalLayer(null);
        }

        // Repopulate line-field selector; restore previous selection by name if it still exists.
        const prevLineField = selLineField.value;
        while (selLineField.options.length > 1) selLineField.remove(1);
        sceneLineFieldLayers.length = 0;
        sceneLineFieldLayers.push(...(newScene.line_field_layers ?? []));
        for (const layer of sceneLineFieldLayers) {
          const opt = document.createElement("option");
          opt.value = layer.name;
          opt.textContent = layer.name;
          selLineField.appendChild(opt);
        }
        const restoredLineField =
          sceneLineFieldLayers.find((l) => l.name === prevLineField) ?? null;
        if (prevLineField && restoredLineField) {
          selLineField.value = prevLineField;
          applyLineFieldLayer(prevLineField);
        } else {
          selLineField.value = "";
          applyLineFieldLayer("");
        }

        // Repopulate triangle selector; restore previous selection by name if it still exists.
        const prevTriangles = selTriangles.value;
        while (selTriangles.options.length > 1) selTriangles.remove(1);
        sceneTriangleLayers.length = 0;
        sceneTriangleLayers.push(...(newScene.triangle_layers ?? []));
        for (const layer of sceneTriangleLayers) {
          const opt = document.createElement("option");
          opt.value = layer.name;
          opt.textContent = layer.name;
          selTriangles.appendChild(opt);
        }
        const restoredTriangles =
          sceneTriangleLayers.find((l) => l.name === prevTriangles) ?? null;
        if (prevTriangles && restoredTriangles) {
          selTriangles.value = prevTriangles;
          applyTriangleLayer(prevTriangles);
        } else {
          selTriangles.value = "";
          applyTriangleLayer("");
        }

        // Rebuild gen panel from new schema.
        // sentParams: params that were sent to the server (regen case) — use these so
        // the panel always reflects what was actually used, not server-echoed defaults.
        // Omitted on generator switch, so new generator's schema defaults apply.
        const selGen = document.getElementById("sel-generator");
        if (newScene.generator_params && newScene.generator_param_schema) {
          selGen.value =
            sentParams?.generator ?? newScene.generator_params.generator ?? "";
          rebuildGenPanel(
            sentParams ?? newScene.generator_params,
            newScene.generator_param_schema,
          );
        }

        buildLegend();
        refreshDebugConsole("rehydrate complete");
        document.getElementById("meta-n").textContent =
          `N=${newN}  D=${newD}  K=2`;
      }
      // ── Resize ───────────────────────────────────────────────────────────────────
      function onResize() {
        const wrap = document.getElementById("canvas-wrap");
        const w = wrap.clientWidth,
          h = wrap.clientHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", onResize);
      onResize();
      refreshDebugConsole("initial");
      pushDebugLine("viewer initialized");

      // ── Render loop ──────────────────────────────────────────────────────────────
      (function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      })();
    </script>
  </body>
</html>
