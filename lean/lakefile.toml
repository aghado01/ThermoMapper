name = "lemmas"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Lemmas", "Theorems", "Enthymemata"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "Lemmas"

[[lean_lib]]
name = "Theorems"

[[lean_lib]]
name = "Enthymemata"
